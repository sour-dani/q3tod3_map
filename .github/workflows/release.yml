on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Github Release Tag'
        required: true

run-name: Release ${{ inputs.tag }}

jobs:
  release-linux:
    name: Release Linux ${{ inputs.tag }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
            version: '6.4.2'
            target: 'desktop'

      - name: Create Project Files
        run: |
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=staging

      - name: Compile
        run: |
          ninja install -C build

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/src/cli/q3tod3_map
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/src/gui/q3tod3_map_gui
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true

  release-windows:
    name: Release Windows ${{ inputs.tag }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure Dependencies
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Create Makefiles
        run: |
          cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=staging

      - name: Compile
        run: |
          ninja install -C build

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/src/cli/q3tod3_map.exe
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/src/gui/q3tod3_map_gui.exe
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: true
