name: Compile

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v7

      - name: Compile
        shell: bash
        run: |
          g++ g3tod3_map.cpp -o g3tod3_map
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: g3tod3_map-linux
          path: g3tod3_map
    
  build-linux:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Compile
        shell: bash
        run: |
          g++ g3tod3_map.cpp -o g3tod3_map.exe
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: g3tod3_map-windows
          path: g3tod3_map.exe