name: Compile

on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Compile
        shell: bash
        run: |
          g++ q3tod3_map.cpp -o q3tod3_map -std=c++17
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: q3tod3_map-x86_64-gcc-linux
          path: q3tod3_map
          retention-days: 1
          if-no-files-found: error
    
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure Dependencies
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Compile
        run: |
          msbuild q3tod3_map.sln /p:Configuration=Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: q3tod3_map-x86_64-msvc-windows
          path: x64/Release/q3tod3_map.exe
          retention-days: 1
          if-no-files-found: error
