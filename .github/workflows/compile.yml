name: Compile

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Compile
        shell: bash
        run: |
          g++ q3tod3_map.cpp -o q3tod3_map
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: q3tod3_map-gcc-linux
          path: q3tod3_map
    
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure Dependencies
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        run: |
          devenv q3tod3_map.sln /build Release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: q3tod3_map-msvc-windows
          path: build/Release/bin/q3tod3_map.exe